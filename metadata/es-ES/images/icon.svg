<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="card-shadow" x="-15%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.32"/>
    </filter>
    <filter id="drop-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    
  </defs>
  
  <!-- Transparent canvas with rounded squircle badge (Ideal for F-Droid web and client) -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bg-grad)" filter="url(#card-shadow)"/>
  
  <!-- App Symbol -->
  
        <!-- Outer Compass Ring -->
        <circle cx="256" cy="256" r="140" fill="none" stroke="#FFFFFF" stroke-width="14" opacity="0.95"/>
        <circle cx="256" cy="256" r="115" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.5" stroke-dasharray="6 14"/>
        
        <!-- Cardinal Markers -->
        <line x1="256" y1="126" x2="256" y2="148" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
        <line x1="256" y1="386" x2="256" y2="364" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
        <line x1="126" y1="256" x2="148" y2="256" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
        <line x1="386" y1="256" x2="364" y2="256" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
        
        <!-- North Label Marker -->
        <text x="256" y="112" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="26" font-weight="900" fill="#FFFFFF" text-anchor="middle">N</text>
        
        <!-- Compass Precision Needle (Rotated North-East) -->
        <g transform="rotate(25, 256, 256)">
          <!-- North Tip (Vibrant Coral/Orange) -->
          <polygon points="256,155 278,256 256,242" fill="#ef4444"/>
          <polygon points="256,155 234,256 256,242" fill="#f87171"/>
          
          <!-- South Tip (Clean Pure White/Silver) -->
          <polygon points="256,357 278,256 256,270" fill="#e2e8f0"/>
          <polygon points="256,357 234,256 256,270" fill="#FFFFFF"/>
          
          <!-- Center Pivot Pivot Pin -->
          <circle cx="256" cy="256" r="18" fill="#0f172a"/>
          <circle cx="256" cy="256" r="10" fill="#FFFFFF"/>
          <circle cx="256" cy="256" r="4" fill="#059669"/>
        </g>
        
</svg>